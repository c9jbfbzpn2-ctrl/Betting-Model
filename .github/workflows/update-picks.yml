name: Update picks

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours; Kalshi and ESPN are free, so no credits are used
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/generate_picks.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit picks and history
        run: |
          git config user.name "picks-bot"
          git config user.email "picks-bot@users.noreply.github.com"
          git add picks.json history.json model_state.json debug.json
          git diff --staged --quiet || (git commit -m "Update picks" && git pull --rebase -q && git push)
