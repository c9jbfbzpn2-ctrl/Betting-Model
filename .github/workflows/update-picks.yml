name: Update picks

on:
  schedule:
    - cron: "0 13 * * *"   # daily, 13:00 UTC
  workflow_dispatch:         # lets you run it by hand

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/generate_picks.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: Commit picks.json
        run: |
          git config user.name "picks-bot"
          git config user.email "picks-bot@users.noreply.github.com"
          git add picks.json
          git diff --staged --quiet || (git commit -m "Update picks" && git push)
